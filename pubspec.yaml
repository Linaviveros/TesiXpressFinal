name: tesi_xpress
description: "TesiXpress — Thesis evaluator with OpenAI + Supabase"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.6.0
  http: ^1.2.2
  http_parser: ^4.0.2
  file_picker: ^8.0.6
  path: ^1.9.0
  xml: ^6.5.0
  archive: ^3.6.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  syncfusion_flutter_pdf: ^31.1.19
  uuid: ^4.5.1
  flutter_markdown: ^0.6.20+1   # ← NUEVO: render bonito del texto del asistente

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/prompts/analysis_prompt.json
